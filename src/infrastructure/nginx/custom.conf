# ─── Internal Admin Auth Subrequest ─────────────────────────────
location = /internal_admin_auth {
    internal;
    fastcgi_index index.php;
    fastcgi_pass php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /home/uypanel/public/auth_check.php;
    fastcgi_param SCRIPT_NAME /public/auth_check.php;
    fastcgi_pass_request_body off;
    fastcgi_param CONTENT_LENGTH "";
}

# ─── Universal Stream Extractor (Admin Only) ────────────────────
location ^~ /stream_extractor/ {
    # Gate de autenticación estricta: sólo administradores autenticados
    auth_request /internal_admin_auth;
    
    # Anti-sondeo: Si no está autenticado, 404 Nginx inmediato
    error_page 401 403 =404 @extractor_denied;

    proxy_pass http://127.0.0.1:3200;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /stream_extractor;
    proxy_buffering off;
    proxy_read_timeout 300s;
}

location @extractor_denied {
    return 404;
}

location = /stream_extractor {
    return 301 /stream_extractor/;
}
